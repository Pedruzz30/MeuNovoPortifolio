name: Portfolio — quality and Pages

on:
  push:
    branches:
      - main
      - feat/portfolio-complete-20261117
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build + browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image build dependency
        run: python -m pip install Pillow==11.3.0
      - name: Build optimized static site
        run: python scripts/build.py
      - name: Check scripts and HTML structure
        run: |
          node --check js/hero-effects.js
          node --check js/selected-work.js
          node --check js/portfolio-sections.js
          node --check tests/visual/responsive-test.mjs
          python scripts/check_build.py
      - name: Start local preview and headless Chrome
        run: |
          python -m http.server 5501 --bind 127.0.0.1 --directory dist > /tmp/portfolio-server.log 2>&1 &
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --user-data-dir=/tmp/portfolio-cdp about:blank > /tmp/portfolio-chrome.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9222/json/list > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5501/ > /dev/null
          curl -fsS http://127.0.0.1:9222/json/list > /dev/null
      - name: Browser smoke test
        run: node tests/visual/smoke-test.mjs http://127.0.0.1:5501/
      - name: Responsive and interaction tests
        run: node tests/visual/responsive-test.mjs http://127.0.0.1:5501/
      - name: Preserve QA desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: /tmp/portfolio-shots/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Publish GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image build dependency
        run: python -m pip install Pillow==11.3.0
      - name: Build deployment
        run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
